<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Xonotic WASM</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			background: #0a0a0a;
			color: #e0e0e0;
			font-family: 'Segoe UI', Tahoma, sans-serif;
			overflow: hidden;
		}
		#container {
			position: relative;
			width: 100vw;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		canvas {
			display: block;
			background: #000;
			width: 100vw !important;
			height: 100vh !important;
		}

		/* --- Settings Panel --- */
		#settingsPanel {
			position: absolute;
			top: 0; left: 0; right: 0; bottom: 0;
			background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 110;
		}
		#settingsPanel.hidden { display: none; }
		#settingsForm {
			background: rgba(20, 20, 40, 0.9);
			border: 1px solid #333;
			border-radius: 12px;
			padding: 30px 40px;
			width: 520px;
			max-height: 90vh;
			overflow-y: auto;
		}
		#settingsForm h1 {
			color: #ff6600;
			font-size: 28px;
			margin-bottom: 20px;
			text-align: center;
		}
		.settings-section {
			margin-bottom: 20px;
		}
		.settings-section h3 {
			color: #ff9900;
			font-size: 14px;
			text-transform: uppercase;
			letter-spacing: 1px;
			margin-bottom: 10px;
			border-bottom: 1px solid #333;
			padding-bottom: 5px;
		}
		.settings-row {
			display: flex;
			align-items: center;
			margin-bottom: 8px;
		}
		.settings-row label {
			width: 130px;
			color: #aaa;
			font-size: 13px;
		}
		.settings-row input[type="text"],
		.settings-row input[type="number"],
		.settings-row select {
			flex: 1;
			padding: 6px 10px;
			background: #0a0a0a;
			border: 1px solid #333;
			color: #e0e0e0;
			border-radius: 4px;
			font-size: 13px;
		}
		.settings-row input[type="range"] {
			flex: 1;
		}
		.settings-row .value {
			width: 45px;
			text-align: right;
			color: #ff9900;
			font-size: 12px;
			margin-left: 8px;
		}
		.color-picker-row {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 8px;
		}
		.color-picker-row label {
			width: 130px;
			color: #aaa;
			font-size: 13px;
		}
		.color-swatch {
			width: 24px;
			height: 24px;
			border-radius: 4px;
			border: 1px solid #444;
		}
		#playBtn {
			display: block;
			width: 100%;
			padding: 12px;
			margin-top: 15px;
			background: linear-gradient(90deg, #ff6600, #ff9900);
			border: none;
			color: #fff;
			font-size: 16px;
			font-weight: bold;
			border-radius: 6px;
			cursor: pointer;
			text-transform: uppercase;
			letter-spacing: 2px;
		}
		#playBtn:hover { opacity: 0.9; }
		#playBtn:disabled { opacity: 0.5; cursor: not-allowed; }

		/* --- Loading Overlay --- */
		#loadingOverlay {
			position: absolute;
			top: 0; left: 0; right: 0; bottom: 0;
			background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 100;
			transition: opacity 0.5s;
		}
		#loadingOverlay.hidden { opacity: 0; pointer-events: none; }
		#loadingTitle {
			font-size: 48px;
			font-weight: bold;
			color: #ff6600;
			text-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
			margin-bottom: 20px;
		}
		#loadingStatus {
			font-size: 16px;
			color: #888;
			margin-bottom: 20px;
			min-height: 24px;
		}
		#loadingBar {
			width: 400px;
			height: 4px;
			background: #222;
			border-radius: 2px;
			overflow: hidden;
		}
		#loadingProgress {
			height: 100%;
			background: linear-gradient(90deg, #ff6600, #ff9900);
			width: 0%;
			transition: width 0.3s;
		}

		/* --- Connect Dialog --- */
		#connectDialog {
			position: absolute;
			top: 50%; left: 50%;
			transform: translate(-50%, -50%);
			background: #1a1a2e;
			border: 2px solid #ff6600;
			border-radius: 8px;
			padding: 25px;
			z-index: 210;
			display: none;
			min-width: 420px;
		}
		#connectDialog.show { display: block; }
		#connectDialog h2 {
			color: #ff6600;
			margin-bottom: 15px;
		}
		#connectDialog label {
			display: block;
			color: #aaa;
			font-size: 13px;
			margin-bottom: 5px;
		}
		#connectDialog input, #connectDialog select {
			width: 100%;
			padding: 8px 12px;
			background: #0a0a0a;
			border: 1px solid #333;
			color: #e0e0e0;
			border-radius: 4px;
			font-size: 13px;
			margin-bottom: 12px;
		}
		#connectDialog .btn-row {
			display: flex;
			gap: 10px;
			margin-top: 5px;
		}
		#connectDialog button {
			flex: 1;
			padding: 10px 20px;
			background: #ff6600;
			border: none;
			color: #fff;
			font-size: 14px;
			border-radius: 4px;
			cursor: pointer;
		}
		#connectDialog button:hover { background: #ff9900; }
		#connectDialog button.cancel { background: #333; }
		#connectDialog button.cancel:hover { background: #555; }

		/* --- Server Browser --- */
		#serverBrowser {
			position: absolute;
			top: 50%; left: 50%;
			transform: translate(-50%, -50%);
			background: #1a1a2e;
			border: 2px solid #ff6600;
			border-radius: 8px;
			padding: 20px;
			z-index: 210;
			display: none;
			width: 800px;
			max-width: 90vw;
			max-height: 80vh;
			overflow: hidden;
			display: none;
			flex-direction: column;
		}
		#serverBrowser.show { display: flex; }
		#serverBrowser h2 {
			color: #ff6600;
			margin-bottom: 12px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		#serverBrowser h2 .actions { display: flex; gap: 8px; }
		#serverBrowser h2 button {
			padding: 4px 12px;
			background: #ff6600;
			border: none;
			color: #fff;
			font-size: 12px;
			border-radius: 4px;
			cursor: pointer;
		}
		#serverBrowser h2 button:hover { background: #ff9900; }
		#serverBrowser h2 button.cancel { background: #333; }
		#serverBrowser h2 button.cancel:hover { background: #555; }
		#serverListContainer {
			flex: 1;
			overflow-y: auto;
			border: 1px solid #333;
			border-radius: 4px;
		}
		#serverList {
			width: 100%;
			border-collapse: collapse;
			font-size: 13px;
		}
		#serverList th {
			background: #0a0a0a;
			color: #ff9900;
			padding: 8px 10px;
			text-align: left;
			position: sticky;
			top: 0;
			border-bottom: 1px solid #333;
		}
		#serverList td {
			padding: 6px 10px;
			border-bottom: 1px solid #1a1a2e;
			color: #ccc;
		}
		#serverList tr { cursor: pointer; }
		#serverList tr:hover td { background: rgba(255, 102, 0, 0.15); }
		#serverList .players { color: #8f8; font-weight: bold; }
		#serverList .ping { color: #aaa; }
		#serverList .empty { color: #555; }
			#serverList th.sortable { cursor: pointer; user-select: none; }
			#serverList th.sortable:hover { color: #fff; }
			#serverList th.sortable::after { content: ' \21C5'; font-size: 10px; opacity: 0.4; }
			#serverList th.sortable.sorted-asc { color: #fff; }
			#serverList th.sortable.sorted-asc::after { content: ' \2191'; opacity: 1; }
			#serverList th.sortable.sorted-desc { color: #fff; }
			#serverList th.sortable.sorted-desc::after { content: ' \2193'; opacity: 1; }
			.serverBrowserToolbar { margin-bottom: 10px; flex-shrink: 0; }
			#serverSearch {
				width: 100%;
				padding: 8px 12px;
				background: #0a0a0a;
				border: 1px solid #333;
				border-radius: 4px;
				color: #ccc;
				font-size: 13px;
				box-sizing: border-box;
			}
			#serverSearch:focus { outline: none; border-color: #ff6600; }
		#serverBrowserStatus {
			padding: 8px;
			color: #888;
			font-size: 12px;
			text-align: center;
		}

		/* --- Console --- */
		#console {
			position: absolute;
			bottom: 0; left: 0; right: 0;
			height: 150px;
			background: rgba(0, 0, 0, 0.8);
			overflow-y: auto;
			font-family: 'Consolas', monospace;
			font-size: 12px;
			padding: 5px;
			display: none;
			z-index: 50;
		}
		#console.show { display: block; }
		#console div { color: #ccc; line-height: 1.4; }
		#console div.error { color: #ff4444; }

		/* --- Toolbar --- */
		#toolbar {
			position: absolute;
			top: 10px; right: 10px;
			z-index: 200;
			display: flex;
			gap: 8px;
			pointer-events: auto;
		}
		#toolbar button {
			padding: 8px 16px;
			background: rgba(255, 102, 0, 0.85);
			border: 1px solid #ff9900;
			color: #fff;
			font-size: 13px;
			font-weight: bold;
			border-radius: 4px;
			cursor: pointer;
			pointer-events: auto;
			text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
		}
		#toolbar button:hover { background: rgba(255, 153, 0, 1); color: #fff; }

		/* Xonotic color palette (0-15) */
		.xon-colors {
			display: flex;
			gap: 3px;
			flex-wrap: wrap;
		}
		.xon-color-btn {
			width: 22px;
			height: 22px;
			border-radius: 3px;
			border: 2px solid transparent;
			cursor: pointer;
		}
		.xon-color-btn.selected { border-color: #fff; }
	</style>
</head>
<body>
	<div id="container">
		<canvas id="canvas"></canvas>

		<!-- Settings Panel (pre-engine) -->
		<div id="settingsPanel">
			<div id="settingsForm">
				<h1>XONOTIC</h1>

				<div class="settings-section">
					<h3>Player</h3>
					<div class="settings-row">
						<label>Name</label>
						<input type="text" id="playerName" value="Player" maxlength="20">
					</div>
					<div class="settings-row">
						<label>Model</label>
						<select id="playerModel">
							<option value="models/player/erebus.iqm">Erebus</option>
							<option value="models/player/ignis.iqm">Ignis</option>
							<option value="models/player/nyx.iqm">Nyx</option>
							<option value="models/player/pyria.iqm">Pyria</option>
							<option value="models/player/seraphina.iqm">Seraphina</option>
							<option value="models/player/umbra.iqm">Umbra</option>
							<option value="models/player/gak.iqm">Gak</option>
							<option value="models/player/gakmasked.iqm">Gak (Masked)</option>
							<option value="models/player/ignismasked.iqm">Ignis (Masked)</option>
							<option value="models/player/seraphinamasked.iqm">Seraphina (Masked)</option>
						</select>
					</div>
					<div class="settings-row">
						<label>Skin</label>
						<select id="playerSkin">
							<option value="0">Skin 0 (Fullbright)</option>
							<option value="1">Skin 1 (Normal)</option>
						</select>
					</div>
					<div class="color-picker-row">
						<label>Shirt Color</label>
						<div class="xon-colors" id="shirtColors"></div>
					</div>
					<div class="color-picker-row">
						<label>Pants Color</label>
						<div class="xon-colors" id="pantsColors"></div>
					</div>
				</div>

				<div class="settings-section">
					<h3>Audio</h3>
					<div class="settings-row">
						<label>Master Volume</label>
						<input type="range" id="volume" min="0" max="1" step="0.05" value="0.7">
						<span class="value" id="volumeVal">70%</span>
					</div>
					<div class="settings-row">
						<label>Music Volume</label>
						<input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.3">
						<span class="value" id="musicVolumeVal">30%</span>
					</div>
				</div>

				<div class="settings-section">
					<h3>Network</h3>
					<div class="settings-row">
						<label>WS Proxy URL</label>
						<input type="text" id="wsProxyUrl" value="ws://localhost:8081">
					</div>
					<div class="settings-row">
						<label>Server Favorites</label>
						<input type="text" id="serverFavorites" value="127.0.0.1:26000">
					</div>
				</div>

				<div class="settings-section">
					<h3>Video</h3>
					<div class="settings-row">
						<label>FOV</label>
						<input type="range" id="fov" min="80" max="130" step="1" value="100">
						<span class="value" id="fovVal">100</span>
					</div>
					<div class="settings-row">
						<label>Resolution Scale</label>
						<input type="range" id="resScale" min="0.5" max="1.0" step="0.05" value="1.0">
						<span class="value" id="resScaleVal">100%</span>
					</div>
					<div class="settings-row">
						<label>Quality</label>
						<select id="quality">
							<option value="fast">Fast</option>
							<option value="normal" selected>Normal</option>
							<option value="high">High</option>
						</select>
					</div>
				</div>

				<button id="playBtn">Play</button>
			</div>
		</div>

		<!-- Loading Overlay -->
		<div id="loadingOverlay" class="hidden">
			<div id="loadingTitle">XONOTIC</div>
			<div id="loadingStatus">Initializing...</div>
			<div id="loadingBar">
				<div id="loadingProgress"></div>
			</div>
		</div>

		<!-- Connect Dialog -->
		<div id="connectDialog">
			<h2>Connect to Server</h2>
			<label>Server Address (host:port)</label>
			<input type="text" id="serverAddress" value="localhost:26000" placeholder="host:port">
			<label>Connection Mode</label>
			<select id="connectMode">
				<option value="udp">WebSocket (UDP)</option>
				<option value="tcp">TCP Bridge</option>
			</select>
			<label>WS Proxy URL</label>
			<input type="text" id="wsProxyUrlConnect" value="ws://localhost:8081" placeholder="ws://proxy:port">
			<div class="btn-row">
				<button id="connectBtn">Connect</button>
				<button class="cancel" id="cancelConnectBtn">Cancel</button>
			</div>
		</div>

		<!-- Toolbar -->
		<div id="toolbar" style="display:none;">
			<button id="browseBtn" title="Browse online servers">Browse</button>
			<button id="connectMenuBtn" title="Connect to server">Connect</button>
			<button id="settingsBtn" title="Settings">Settings</button>
			<button id="consoleBtn" title="Toggle console">Console</button>
		</div>

		<!-- Server Browser -->
		<div id="serverBrowser">
			<h2>
				<span>Server Browser</span>
				<div class="actions">
					<button id="refreshServersBtn">Refresh</button>
					<button class="cancel" id="closeBrowserBtn">Close</button>
				</div>
			</h2>
			<div class="serverBrowserToolbar">
				<input type="text" id="serverSearch" placeholder="Search server name or map..." autocomplete="off" oninput="renderServerList()">
			</div>
			<div id="serverListContainer">
				<table id="serverList">
					<thead>
						<tr>
							<th data-sort="hostname" class="sortable">Server Name</th>
							<th data-sort="map" class="sortable">Map</th>
							<th data-sort="players" class="sortable">Players</th>
							<th data-sort="ping" class="sortable">Ping</th>
							<th>Address</th>
						</tr>
					</thead>
					<tbody id="serverListBody">
					</tbody>
				</table>
			</div>
			<div id="serverBrowserStatus">Click Refresh to query online servers</div>
		</div>

		<!-- Map Download Overlay -->
		<div id="mapDownloadOverlay" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:2px solid #ff6600;border-radius:8px;padding:30px 40px;z-index:300;display:none;text-align:center;">
			<h3 id="mapDlTitle" style="color:#ff6600;margin-bottom:15px;">Downloading Map...</h3>
			<div id="mapDlStatus" style="color:#aaa;font-size:14px;margin-bottom:10px;">Fetching map package...</div>
			<div style="width:300px;height:8px;background:#0a0a0a;border-radius:4px;overflow:hidden;">
				<div id="mapDlProgress" style="width:0%;height:100%;background:#ff6600;transition:width 0.3s;"></div>
			</div>
		</div>

		<!-- Console -->
		<div id="console"></div>
	</div>

	<script src="map-assets.js"></script>
	<script>
		// --- Xonotic color palette (0-15) ---
		var XON_COLORS = [
			[0, 0, 0],       [255, 80, 80],   [80, 255, 80],   [80, 80, 255],
			[255, 255, 80],  [255, 80, 255],  [80, 255, 255],  [255, 255, 255],
			[128, 128, 128], [192, 80, 80],   [80, 192, 80],   [80, 80, 192],
			[192, 192, 80],  [192, 80, 192],  [80, 192, 192],  [192, 192, 192]
		];
		var selectedShirt = 0, selectedPants = 0;

		function buildColorPicker(containerId, onSelect) {
			var container = document.getElementById(containerId);
			XON_COLORS.forEach(function(rgb, i) {
				var btn = document.createElement('div');
				btn.className = 'xon-color-btn';
				btn.style.background = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
				btn.dataset.idx = i;
				if (i === 0) btn.classList.add('selected');
				btn.addEventListener('click', function() {
					container.querySelectorAll('.xon-color-btn').forEach(function(b) { b.classList.remove('selected'); });
					btn.classList.add('selected');
					onSelect(i);
				});
				container.appendChild(btn);
			});
		}
		buildColorPicker('shirtColors', function(i) { selectedShirt = i; });
		buildColorPicker('pantsColors', function(i) { selectedPants = i; });

		// --- Slider value displays ---
		function bindSlider(id, valId, fmt) {
			var slider = document.getElementById(id);
			var val = document.getElementById(valId);
			slider.addEventListener('input', function() { val.textContent = fmt(slider.value); });
		}
		bindSlider('volume', 'volumeVal', function(v) { return Math.round(v * 100) + '%'; });
		bindSlider('musicVolume', 'musicVolumeVal', function(v) { return Math.round(v * 100) + '%'; });
		bindSlider('fov', 'fovVal', function(v) { return v; });
		bindSlider('resScale', 'resScaleVal', function(v) { return Math.round(v * 100) + '%'; });

		// --- Console capture ---
		var consoleDiv = document.getElementById('console');
		var origLog = console.log;
		var origErr = console.error;
		function addConsoleLine(text, isError) {
			var div = document.createElement('div');
			div.textContent = text;
			if (isError) div.className = 'error';
			consoleDiv.appendChild(div);
			consoleDiv.scrollTop = consoleDiv.scrollHeight;
			while (consoleDiv.children.length > 200) consoleDiv.removeChild(consoleDiv.firstChild);
		}

		// --- Engine state ---
		var engineStarted = false;
		var menuNavigated = false;
		var switchingServer = false;
		var connectSeq = 0;

		function engineExec(cmd) {
			try {
				Module.ccall('em_exec', null, ['string'], [cmd]);
			} catch (e) {
				console.warn('em_exec failed:', cmd, e && e.message ? e.message : e);
			}
		}

		// Leave the current dedicated immediately so a new pick does not keep
		// the old match running while the next map downloads.
		function leaveCurrentMatch() {
			switchingServer = true;
			engineExec('disconnect');
		}

		// --- Error notifications ---
		function showMapError(msg) {
			var existing = document.getElementById('mapErrorToast');
			if (existing) existing.remove();
			var toast = document.createElement('div');
			toast.id = 'mapErrorToast';
			toast.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#2a0a0a;border:2px solid #ff3333;border-radius:8px;padding:16px 24px;z-index:500;max-width:80vw;color:#ffaaaa;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,0.5);cursor:pointer;text-align:center;';
			toast.innerHTML = '<b style="color:#ff6666;font-size:15px;">Map Loading Error</b><br>' + msg.replace(/\^\d/g, '').substring(0, 200) + '<br><span style="color:#888;font-size:12px;">Click to dismiss</span>';
			toast.onclick = function() { toast.remove(); };
			document.body.appendChild(toast);
			setTimeout(function() { if (toast.parentNode) toast.remove(); }, 15000);
		}
		function showDisconnectToast(msg) {
			var existing = document.getElementById('disconnectToast');
			if (existing) existing.remove();
			var toast = document.createElement('div');
			toast.id = 'disconnectToast';
			toast.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:2px solid #ff6600;border-radius:8px;padding:12px 20px;z-index:500;max-width:80vw;color:#ff9900;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,0.5);cursor:pointer;text-align:center;';

		function getProxyHttpUrl() {
			// Convert ws://host:port to http://host:port for /slist fetch
			var wsUrl = document.getElementById('wsProxyUrl').value || 'ws://localhost:8081';
			return wsUrl.replace(/^ws/, 'http');

		function showServerBrowser() {
			serverBrowser.classList.add('show');
			if (serverListBody.children.length === 0) {
				refreshServerList();
			}
		}

		var allServers = [];
			var sortColumn = 'ping';
			var sortDir = 'asc';

			function refreshServerList() {
				var httpUrl = getProxyHttpUrl();
				serverBrowserStatus.textContent = 'Querying master servers...';
				serverListBody.innerHTML = '';

				fetch(httpUrl + '/slist')
					.then(function(r) { return r.json(); })
					.then(function(data) {
						if (data.error) {
							serverBrowserStatus.textContent = 'Error: ' + data.error;
							return;
						}
						allServers = data.servers || [];
						renderServerList();

						if (allServers.length === 0) {
							serverBrowserStatus.textContent = 'No servers found. Make sure the WS proxy is running.';
						}
					})
					.catch(function(err) {
						serverBrowserStatus.textContent = 'Failed to fetch server list: ' + err.message;
					});
			}

			function renderServerList() {
				serverListBody.innerHTML = '';

				var searchQuery = (document.getElementById('serverSearch').value || '').toLowerCase();

				var filtered = allServers.filter(function(s) {
					if (!searchQuery) return true;
					return (s.hostname && s.hostname.toLowerCase().indexOf(searchQuery) !== -1) ||
					       (s.map && s.map.toLowerCase().indexOf(searchQuery) !== -1);
				});

				filtered.sort(function(a, b) {
					var va, vb;
					if (sortColumn === 'ping') {
						va = a.ping || 9999;
						vb = b.ping || 9999;
					} else if (sortColumn === 'players') {
						va = a.players || 0;
						vb = b.players || 0;
					} else {
						va = (a[sortColumn] || '').toLowerCase();
						vb = (b[sortColumn] || '').toLowerCase();
					}
					if (va < vb) return sortDir === 'asc' ? -1 : 1;
					if (va > vb) return sortDir === 'asc' ? 1 : -1;
					return 0;
				});

				serverBrowserStatus.textContent = filtered.length + ' servers' +
					(allServers.length !== filtered.length ? ' (of ' + allServers.length + ')' : '');

				filtered.forEach(function(s) {
					var tr = document.createElement('tr');
					tr.dataset.address = s.address;
					tr.dataset.map = s.map;

					var nameTd = document.createElement('td');
					nameTd.textContent = s.hostname;

					var mapTd = document.createElement('td');
					mapTd.textContent = s.map;

					var playersTd = document.createElement('td');
					var playerStr = s.players + '/' + s.maxplayers;
					playersTd.textContent = playerStr;
					playersTd.className = s.players > 0 ? 'players' : 'empty';

					var pingTd = document.createElement('td');
					pingTd.textContent = s.ping || '-';
					pingTd.className = 'ping';

					var addrTd = document.createElement('td');
					addrTd.textContent = s.address;

					tr.appendChild(nameTd);
					tr.appendChild(mapTd);
					tr.appendChild(playersTd);
					tr.appendChild(pingTd);
					tr.appendChild(addrTd);

					tr.addEventListener('click', function() {
						var addr = this.dataset.address;
						var mapName = this.dataset.map;
						var proxyUrl = document.getElementById('wsProxyUrl').value || 'ws://localhost:8081';
						serverBrowser.classList.remove('show');
						connectToServer(addr, mapName, proxyUrl);
					});

					serverListBody.appendChild(tr);
				});

				// Update sort indicators on headers
				var headers = document.querySelectorAll('#serverList th.sortable');
				headers.forEach(function(th) {
					th.classList.remove('sorted-asc', 'sorted-desc');
					if (th.dataset.sort === sortColumn) {
						th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
					}
				});
			}

		// --- Map Download & Connect ---
		var mapDlOverlay = document.getElementById('mapDownloadOverlay');
		var mapDlStatus = document.getElementById('mapDlStatus');
		var mapDlProgress = document.getElementById('mapDlProgress');
		var mapDlTitle = document.getElementById('mapDlTitle');

		var lastConnectAddr = null;
		var lastProxyUrl = null;
		var mapRecoverBusy = false;
		var mapRecoverFailed = {};

		function rescanFs() {
			engineExec('fs_rescan');
			console.log('fs_rescan after map/texture prefetch');
		}

		function prefetchThen(mapName) {
			if (!window.xonMapAssets || typeof window.xonMapAssets.prefetch !== 'function') {
				console.warn('map-assets.js not loaded; skipping texture prefetch');
				return Promise.resolve();
			}
			return window.xonMapAssets.prefetch(mapName, function(info) {
				mapDlTitle.textContent = 'Loading textures: ' + mapName;
				mapDlStatus.textContent = info.status || 'Downloading textures...';
				mapDlProgress.style.width = (info.percent || 0) + '%';
			});
		}

		function doConnect(addr, proxyUrl, seq) {
			if (seq !== undefined && seq !== connectSeq) return;
			lastConnectAddr = addr;
			lastProxyUrl = proxyUrl;
			mapDlOverlay.style.display = 'none';
			try {
				engineExec('disconnect');
				engineExec('em_wss ' + proxyUrl + ' binary');
				engineExec('connect ' + addr);
			} catch(e) {
				console.error('Connect failed:', e);
			}
			switchingServer = false;
		}

		function prepareMapAndConnect(addr, mapName, proxyUrl, seq) {
			if (seq !== undefined && seq !== connectSeq) return Promise.resolve();
			mapName = mapName || 'unknown';
			mapDlTitle.textContent = 'Preparing map: ' + mapName;
			mapDlStatus.textContent = 'Checking map package...';
			mapDlProgress.style.width = '0%';
			mapDlOverlay.style.display = 'block';
			return downloadMapPk3(mapName).catch(function(err) {
				console.error('Map download failed, continuing with texture prefetch:', err);
			}).then(function() {
				if (seq !== undefined && seq !== connectSeq) return;
				return prefetchThen(mapName);
			}).then(function() {
				if (seq !== undefined && seq !== connectSeq) return;
				rescanFs();
				doConnect(addr, proxyUrl, seq);
			}).catch(function(err) {
				if (seq !== undefined && seq !== connectSeq) return;
				console.error('Texture prefetch failed, connecting anyway:', err);
				rescanFs();
				doConnect(addr, proxyUrl, seq);
			});
		}

		function liveMapName(addr, fallback, proxyUrl) {
			var httpProxy = String(proxyUrl || 'ws://127.0.0.1:8081').replace(/^ws/, 'http').replace(/\/$/, '');
			return fetch(httpProxy + '/getinfo?addr=' + encodeURIComponent(addr)).then(function(res) {
				if (!res.ok) throw new Error('getinfo HTTP ' + res.status);
				return res.json();
			}).then(function(info) {
				if (info && info.mapname) {
					console.log('Live map for ' + addr + ' is ' + info.mapname + ' (slist said ' + fallback + ', players ' + (info.clients || '?') + ')');
					return info.mapname;
				}
				return fallback;
			}).catch(function(err) {
				console.warn('Live getinfo failed, using ' + fallback + ': ' + err.message);
				return fallback;
			});
		}

		function maybeRecoverMissingMap(text) {
			var m = /Map file 'maps\/([^'/\s]+)\.bsp' not found/i.exec(String(text || ''));
			if (!m || mapRecoverBusy || !lastConnectAddr) return;
			var missing = m[1];
			if (mapRecoverFailed[missing]) return;
			mapRecoverBusy = true;
			var seq = ++connectSeq;
			switchingServer = true;
			console.log('[map-recover] fetching ' + missing + ' then reconnecting to ' + lastConnectAddr);
			showMapError('Missing map ' + missing + ' — downloading and reconnecting…');
			var proxyUrl = lastProxyUrl || (document.getElementById('wsProxyUrl') || {}).value || 'ws://127.0.0.1:8081';
			var addr = lastConnectAddr;
			downloadMapPk3(missing).then(function() {
				if (seq !== connectSeq) return;
				return prefetchThen(missing);
			}).then(function() {
				if (seq !== connectSeq) return;
				rescanFs();
				doConnect(addr, proxyUrl, seq);
			}).catch(function(err) {
				if (seq !== connectSeq) return;
				console.error('[map-recover] failed for ' + missing + ':', err);
				mapRecoverFailed[missing] = true;
				showMapError('Could not download map ' + missing);
				switchingServer = false;
			}).then(function() {
				mapRecoverBusy = false;
			});
		}

		function connectToServer(addr, mapName, proxyUrl) {
			var seq = ++connectSeq;
			console.log('Connecting to: ' + addr + ' (map: ' + mapName + ') via ' + proxyUrl);
			mapName = mapName || 'unknown';
			mapDlTitle.textContent = 'Preparing map: ' + mapName;
			mapDlStatus.textContent = 'Leaving current match...';
			mapDlProgress.style.width = '0%';
			mapDlOverlay.style.display = 'block';
			lastConnectAddr = addr;
			lastProxyUrl = proxyUrl;
			leaveCurrentMatch();
			mapDlStatus.textContent = 'Checking current server map...';
			liveMapName(addr, mapName, proxyUrl).then(function(live) {
				if (seq !== connectSeq) return;
				return prepareMapAndConnect(addr, live || mapName, proxyUrl, seq);
			});
		}

		function writePackToMemfs(filename, buffer) {
			try { FS.mkdir('/game/xonotic-maps.pk3dir'); } catch (e) { /* exists */ }
			var stream = FS.open('/game/xonotic-maps.pk3dir/' + filename, 'w');
			FS.write(stream, buffer, 0, buffer.byteLength);
			FS.close(stream);
		}

		function downloadPackCached(url, filename) {
			if (typeof caches === 'undefined')
				return Module.downloadPack(url, filename);
			return caches.open('xon-postboot-v1').then(function(cache) {
				return cache.match(url).then(function(hit) {
					if (hit && hit.ok) {
						return hit.arrayBuffer().then(function(ab) {
							var buf = new Uint8Array(ab);
							writePackToMemfs(filename, buf);
							console.log('[downloadPack] Cache Storage hit ' + url + ' (' + buf.byteLength + ' bytes)');
							return new Promise(function(resolve) {
								try {
									FS.syncfs(false, function(err) {
										if (err) console.warn('[downloadPack] IDBFS sync failed:', err);
										resolve();
									});
								} catch (e) { resolve(); }
							});
						});
					}
					return Module.downloadPack(url, filename).then(function() {
						return fetch(url, { cache: 'force-cache' }).then(function(res) {
							if (res && res.ok) return cache.put(url, res);
						}).catch(function() {});
					});
				});
			});
		}

		function downloadMapPk3(mapName) {
			// Check if map already exists in the engine's filesystem
			// Try common map paths (loose .bsp files)
			var mapPaths = [
				'/game/xonotic-maps.pk3dir/maps/' + mapName + '.bsp',
				'/game/xonotic-data.pk3dir/maps/' + mapName + '.bsp',
			];
			for (var i = 0; i < mapPaths.length; i++) {
				try {
					if (FS.stat(mapPaths[i]).size > 0) {
						console.log('Map ' + mapName + ' already exists at ' + mapPaths[i]);
						return Promise.resolve();
					}
				} catch(e) { /* not found */ }
			}

			// Check if a pk3 for this map is already in xonotic-maps.pk3dir OR xonotic-data.pk3dir
			var pk3Dirs = ['/game/xonotic-maps.pk3dir', '/game/xonotic-data.pk3dir'];
			for (var d = 0; d < pk3Dirs.length; d++) {
				try {
					var mapFiles = FS.readdir(pk3Dirs[d]);
					for (var i = 0; i < mapFiles.length; i++) {
						var fname = mapFiles[i].toLowerCase();
						if (fname.indexOf('.pk3') !== -1 && fname.indexOf(mapName.toLowerCase()) !== -1) {
							console.log('Map pk3 already in ' + pk3Dirs[d] + ': ' + mapFiles[i]);
							return Promise.resolve();
						}
					}
				} catch(e) { /* dir doesn't exist */ }
			}

			// Show download overlay
			mapDlTitle.textContent = 'Downloading Map: ' + mapName;
			mapDlStatus.textContent = 'Searching for map package...';
			mapDlProgress.style.width = '0%';
			mapDlOverlay.style.display = 'block';

			function afterPack(filename) {
				mapDlStatus.textContent = 'Installing map package...';
				mapDlProgress.style.width = '50%';
				try {
					Module.ccall('em_exec', null, ['string'], ['fs_rescan']);
					console.log('fs_rescan called after downloading ' + filename);
				} catch(e) { console.warn('fs_rescan failed:', e); }
			}

			function findLocalHashedPack() {
				return fetch('/mapfind?name=' + encodeURIComponent(mapName)).then(function(res) {
					if (!res.ok) throw new Error('mapfind HTTP ' + res.status);
					return res.json();
				}).then(function(j) {
					var files = (j && j.files) || [];
					if (!files.length) throw new Error('no local pack for ' + mapName);
					var f = files[0];
					var filename = f.filename || (f.path && f.path.split('/').pop());
					mapDlStatus.textContent = 'Installing ' + filename + '...';
					console.log('Local map pack /game/' + f.path + ' -> xonotic-maps.pk3dir/' + filename);
					return downloadPackCached('/game/' + f.path, filename).then(function() {
						afterPack(filename);
					});
				});
			}

			// Official maps are hashed zips under xonotic/data/, not <map>.pk3 on the
			// community CDN. Try those first; CDN is for extra/community packs.
			var cdnBase = location.protocol + '//' + location.hostname + ':9080/mapdl/';
			var candidates = [
				mapName + '.pk3',
				'cts_' + mapName + '.pk3',
				mapName.toLowerCase() + '.pk3',
				'cts_' + mapName.toLowerCase() + '.pk3',
			];

			function tryNextCandidate(idx) {
				if (idx >= candidates.length) {
					return Promise.reject(new Error('Map package not found on CDN'));
				}
				var filename = candidates[idx];
				var url = cdnBase + filename;
				mapDlStatus.textContent = 'Trying ' + filename + '...';

				return downloadPackCached(url, filename).then(function() {
					afterPack(filename);
				}).catch(function(err) {
					console.log('Candidate ' + filename + ' failed: ' + err.message);
					return tryNextCandidate(idx + 1);
				});
			}

			return findLocalHashedPack().catch(function(err) {
				console.log('Local pack miss: ' + err.message);
				return tryNextCandidate(0);
			});
		}

		window.xonUi = {
			connectToServer: connectToServer,
			showServerBrowser: showServerBrowser,
			refreshServerList: refreshServerList,
			getServers: function () { return allServers.slice(); },
		};

		// --- Console toggle ---
		document.getElementById('consoleBtn').addEventListener('click', function() {
			document.getElementById('console').classList.toggle('show');
		});
		document.addEventListener('keydown', function(e) {
			if (e.key === '`' || e.code === 'Backquote') {
				e.preventDefault();
				document.getElementById('console').classList.toggle('show');
			}
		});
	</script>
	<script>
		if (/(?:^|[?&])harness(?:=|&|$)/.test(location.search)) {
			var harnessScript = document.createElement('script');
			harnessScript.src = 'harness-bridge.js';
			document.body.appendChild(harnessScript);
		}
	</script>
</body>
