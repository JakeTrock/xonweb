# xonweb — full stack for the demo deployment.
#
#   docker compose up -d                 # web + proxy + nginx front
#   docker compose --profile dedicated up -d   # + local Xonotic dedicated :26000/udp
#   docker compose down
#
# Players only ever need the nginx front (:8080): HTTP, WS proxy tunnel,
# server list and error telemetry all ride one port. Direct service ports
# (9080 web, 8081 proxy) are published for local development/harness.
#
# Error capture: browser window.onerror + engine console tail and both Node
# services' crashes land as JSON lines in ./data/errors.jsonl. Read them with
#   node deploy/errors summary
# Disable capture entirely with XONWEB_ERRORS=0.
#
# Harness live-view pages (/view/a, /view/b) are OFF by default here
# (XONWEB_VIEWS=0). Export XONWEB_VIEWS=1 for development on this box.

name: xonweb

services:
  web:
    image: docker.io/library/node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    working_dir: /xonweb
    command: node /xonweb/web/server.js
    environment:
      # Production default: no harness view pages. Override with
      # `XONWEB_VIEWS=1 docker compose up` when driving test/harness CLIs.
      XONWEB_VIEWS: ${XONWEB_VIEWS:-0}
      XONWEB_ERRORS: ${XONWEB_ERRORS:-1}
    ports:
      - "${WEB_PORT:-9080}:9080"
    volumes:
      - .:/xonweb
    restart: unless-stopped
    user: "1000:100"

  proxy:
    image: docker.io/library/node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    working_dir: /xonweb/ws-proxy
    command: sh -c 'test -d node_modules/ws || npm install --omit=dev --no-audit --no-fund; exec node server.js'
    environment:
      XONWEB_ERRORS: ${XONWEB_ERRORS:-1}
    ports:
      - "${PROXY_PORT:-8081}:8081"
    volumes:
      - .:/xonweb
    restart: unless-stopped
    user: "1000:100"

  nginx:
    image: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp
    depends_on:
      - web
      - proxy
    restart: unless-stopped
    user: "101:101"

  dedicated:
    build:
      context: .
      dockerfile: deploy/dedicated.Dockerfile
    profiles: ["dedicated"]
    ports:
      - "${DEDI_PORT:-26000}:26000/udp"
    volumes:
      # Read-only game data: map packs + xonotic-data.pk3dir (compiled progs).
      - ./xonotic/data:/game/data:ro
    # Appended to the image ENTRYPOINT.
    command: ["+map", "xoylent"]
    restart: unless-stopped
